AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Paradise Donut Company - Serverless store menu (IS 531 Serverless Project, Waylan Abbott).
  S3 + CloudFront (front end) -> API Gateway (HTTP API) -> Lambda (Python) -> DynamoDB.

Parameters:
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email for Lambda error alarm notifications (leave blank to skip).

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 5
    Tracing: Active

Resources:
  # ---------- Database ----------
  # Single-table design:
  #   PK = "STORE#<storeId>", SK = "ITEM#<itemId>"   -> one store's menu
  #   PK = "STORES",          SK = "STORE#<storeId>" -> list of stores (for dropdown)
  # Both access patterns are a Query on PK. No Scans.
  MenuTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-menu"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------- Compute ----------
  MenuFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-menu"
      CodeUri: src/get_items/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref MenuTable
          ALLOWED_ORIGIN: !Sub "https://${SiteDistribution.DomainName}"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MenuTable
      Events:
        GetItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref MenuApi
            Path: /items
            Method: GET
        GetStores:
          Type: HttpApi
          Properties:
            ApiId: !Ref MenuApi
            Path: /stores
            Method: GET

  MenuFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MenuFunction}"
      RetentionInDays: 14

  # ---------- API ----------
  MenuApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${SiteDistribution.DomainName}"
          - "http://localhost:8000"
        AllowMethods: [GET, OPTIONS]
        AllowHeaders: [Content-Type]
        MaxAge: 600

  # ---------- Front end ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-site-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Paradise Donut serverless menu
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  # ---------- Monitoring ----------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      Subscription:
        - { Protocol: email, Endpoint: !Ref AlarmEmail }

  MenuErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-menu-lambda-errors"
      AlarmDescription: Menu Lambda returned errors in the last 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref MenuFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref "AWS::NoValue"]

Outputs:
  SiteUrl:
    Description: Public site URL (CloudFront)
    Value: !Sub "https://${SiteDistribution.DomainName}/index.html?store=provo"
  CloudFrontDomain:
    Value: !GetAtt SiteDistribution.DomainName
  DistributionId:
    Value: !Ref SiteDistribution
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${MenuApi}.execute-api.${AWS::Region}.amazonaws.com"
  SiteBucketName:
    Value: !Ref SiteBucket
  TableName:
    Value: !Ref MenuTable
